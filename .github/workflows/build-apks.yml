name: Build User & Admin Panel APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apks:
    name: Build CreatorBoost User & Admin APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Configure Firebase google-services.json & Debug Keystore from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GitHub Secret GOOGLE_SERVICES_JSON is missing."
            exit 1
          fi
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub Secret DEBUG_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore

      - name: Build User Panel APK (:app) and Admin Panel APK (:admin)
        run: gradle :app:assembleDebug :admin:assembleDebug --no-daemon

      - name: Prepare cleanly named APK outputs
        run: |
          mkdir -p dist/user dist/admin
          cp app/build/outputs/apk/debug/app-debug.apk dist/user/FameMaker-User-Panel.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk dist/admin/FameMaker-Admin-Panel.apk

      - name: Upload User Panel APK (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: FameMaker-User-Panel-APK
          path: dist/user/FameMaker-User-Panel.apk
          retention-days: 30

      - name: Upload Admin Panel APK (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: FameMaker-Admin-Panel-APK
          path: dist/admin/FameMaker-Admin-Panel.apk
          retention-days: 30
